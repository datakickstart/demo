resources:
  dashboards:
    retail_executive_dashboard:
      display_name: "[${bundle.target}] Retail Executive Dashboard"
      file_path: ../src/dashboards/retail_executive_dashboard.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # dataset_catalog/schema resolve unqualified table names in dashboard SQL queries
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.gold_schema}
      permissions:
        - level: CAN_RUN
          group_name: "users"
