resources:
  pipelines:
    retail_dw_pipeline:
      name: "[${bundle.target}] Retail DW Pipeline"

      # Target catalog/schema — used as pipeline defaults for unqualified names
      catalog: ${var.catalog}
      target: ${var.bronze_schema}

      libraries:
        - glob:
            include: ../src/pipelines/retail_pipeline/transformations/**

      root_path: ../src/pipelines/retail_pipeline

      serverless: true

      # Pipeline configuration parameters — referenced as ${catalog}, ${raw_schema}, etc. in SQL files
      configuration:
        catalog: ${var.catalog}
        raw_schema: ${var.raw_schema}
        bronze_schema: ${var.bronze_schema}
        silver_schema: ${var.silver_schema}
        gold_schema: ${var.gold_schema}

      continuous: false
      photon: true
      channel: current

      permissions:
        - level: CAN_VIEW
          group_name: "users"
